<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>票务助手 · 流程演示</title><link rel="stylesheet" href="style.css">
<header><span>LOCAL DEMO / 0.1</span><h1>选好目标，验证每一步。</h1><p>此页面只产生模拟订单，不连接大麦，不收取任何费用。</p></header>
<main><section><h2>购票目标</h2><label>按优先级排列票档（逗号分隔）<input id="choices" value="sat680,sat480,sun680"></label><label>张数<input id="quantity" type="number" min="1" max="4" value="1"></label><label>最高总价（元，含费用）<input id="budget" type="number" min="1" value="680"></label><label>几秒后开售<input id="delay" type="number" min="0" value="3"></label><label>测试场景<select id="scenario"><option value="fallback">首选售罄 → 备选成功</option><option value="success">首选成功</option><option value="race">选中首选后售罄 → 备选成功</option><option value="captcha">提交时要求人工验证</option><option value="timeout">提交结果不明（模拟服务端已成功）</option><option value="login">登录失效</option><option value="queue">排队中</option><option value="schema">页面结构改变</option><option value="existing">已有未付款订单</option><option value="price">结算价格超过上限</option><option value="mismatch">返回订单与目标不一致</option></select></label><div class="buttons"><button id="start">启动模拟购票</button><button id="stop" class="secondary">立即停止</button></div></section>
<section><h2>当前状态</h2><div id="state" role="status">尚未启动</div><div id="offers"></div><p id="human"></p><button id="verify" hidden>模拟完成人工验证</button><button id="reconcile" hidden>查询模拟订单结果</button><button id="pay" hidden>模拟付款</button><p class="muted">发生不确定提交时，不切换备选。刷新页面后提交记录仍保留。</p><button id="reset" class="secondary">已核对订单，清除演示记录</button></section><section class="wide"><h2>运行记录</h2><pre id="log" aria-live="polite"></pre></section></main><script src="../extension/engine.js"></script><script src="app.js"></script></html>
